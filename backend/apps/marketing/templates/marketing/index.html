<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PromptLaunch — AI Landing Pages That Convert</title>
  <meta name="description" content="Type what you're selling. Get a live, conversion-built landing page in under a minute." />
  <!--
    In production: link to the Vite-built bundle in /static/dist/
    In development: the React dev server (port 5173) serves this directly,
    so this template is only hit in production.
  -->
  {% load static %}
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'dist/assets/index.css' %}" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="{% static 'dist/assets/index.js' %}"></script>
</body>
</html>
