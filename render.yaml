services:
  - type: web
    name: blynkpages-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py migrate"
    startCommand: "gunicorn promptlaunch.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SETTINGS_MODULE
        value: promptlaunch.settings.base
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      # Comma-separated list of extra origins to allow cross-origin credentialed requests.
      # Add your Vercel production URL here if it's on a custom domain (not *.vercel.app).
      # e.g. https://blynkpages.com,https://www.blynkpages.com
      - key: CORS_EXTRA_ORIGINS
        value: ""
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false
